[package]
name = "proxy_chiffreur"
version = "1.2.0"
edition = "2021"
authors = ["ENSPY SMA 2025-2026"]
description = "Proxy Chiffreur — chiffrement inter-VM (une instance par VM, port 8400)"
license = "MIT"

[lib]
name = "proxy_chiffreur"
path = "src/lib.rs"

[[bin]]
name = "proxy_chiffreur"
path = "src/main.rs"

[dependencies]
aes-gcm       = "0.10"
x25519-dalek  = { version = "2", features = ["static_secrets"] }
argon2        = "0.5"
base64        = "0.22"
rand          = "0.8"
rand_core     = { version = "0.6", features = ["getrandom"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
axum          = { version = "0.7", features = ["json"] }
tokio         = { version = "1", features = ["full"] }
reqwest       = { version = "0.12", features = ["json"] }
hex           = "0.4"
uuid          = { version = "1", features = ["v4"] }
chrono        = { version = "0.4", features = ["serde"] }
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize       = { version = "1", features = ["derive"] }
thiserror     = "1"
anyhow        = "1"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1

[package.metadata.deb]
name = "proxy-chiffreur"
maintainer = "ENSPY SMA 2025-2026 <sma@enspy.local>"
copyright = "2026 ENSPY SMA"
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "systemd"
maintainer-scripts = "debian"
systemd-units = { unit-name = "proxy-chiffreur.service", enable = false }
assets = [
    ["target/release/proxy_chiffreur", "usr/bin/proxy_chiffreur", "755"],
    ["config/proxy_config.example.json", "usr/share/proxy-chiffreur/proxy_config.example.json", "644"],
    ["debian/README.packaging", "usr/share/doc/proxy-chiffreur/README.packaging", "644"],
    ["debian/proxy_chiffreur.service", "lib/systemd/system/proxy-chiffreur.service", "644"],
    ["debian/proxy-chiffreur.default", "etc/default/proxy-chiffreur", "644"],
]
